<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Panel Automation – Row Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0b;
            color: #eee;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        h1 { color: #6acfff; font-size: 24px; margin: 0; }
        .status-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: #0f0f0f;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #222;
            margin-bottom: 15px;
        }
        .status-summary span { font-size: 14px; }
        .status-summary .count { font-weight: bold; color: #6acfff; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: #111;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #222;
            align-items: center;
        }
        .controls .panel-area {
            flex: 2;
            min-width: 200px;
        }
        .controls .panel-area textarea {
            width: 100%;
            background: #1a1a1a;
            color: #ddd;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
        }
        .controls .panel-area .link-count {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .btn-primary { background: #ef4444; color: white; }
        .btn-primary:hover { background: #dc2626; }
        .btn-secondary { background: #333; color: #ddd; }
        .btn-secondary:hover { background: #555; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .mode-select {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .mode-select label { color: #aaa; font-size: 13px; }
        .mode-select input[type="radio"] { accent-color: #ef4444; }

        .row-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .row-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px 16px;
            transition: border-color 0.2s;
        }
        .row-card:hover { border-color: #444; }
        .row-card .phone {
            font-family: 'Courier New', monospace;
            color: #ccc;
            min-width: 120px;
            font-weight: 600;
        }
        .row-card .device {
            font-family: 'Courier New', monospace;
            color: #666;
            font-size: 12px;
            min-width: 140px;
        }
        .row-card .status {
            font-size: 13px;
            font-weight: 500;
            min-width: 120px;
            color: #aaa;
        }
        .row-card .status .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-starting { background: #1a3a5a; color: #7abfff; }
        .badge-otp { background: #3a4a1a; color: #bfff7a; }
        .badge-verify { background: #4a3a1a; color: #ffd77a; }
        .badge-verified { background: #1a4a2a; color: #7affaa; }
        .badge-games { background: #3a1a4a; color: #d07aff; }
        .badge-deleting { background: #4a1a1a; color: #ff7a7a; }
        .badge-done { background: #1a3a2a; color: #7affaa; }
        .badge-error { background: #4a1a1a; color: #ff7a7a; }
        .badge-waiting { background: #4a4a1a; color: #ffff7a; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .row-card .input-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 1;
            min-width: 150px;
        }
        .row-card .input-group input {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 4px 8px;
            color: white;
            font-size: 13px;
            flex: 1;
            min-width: 80px;
        }
        .row-card .input-group input:focus {
            border-color: #ef4444;
            outline: none;
        }
        .row-card .input-group input:disabled { opacity: 0.4; }
        .row-card .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .row-card .coins {
            font-weight: 600;
            color: #ffd700;
            min-width: 60px;
            font-size: 13px;
        }
        .row-card .eligible {
            font-weight: 600;
            min-width: 60px;
            font-size: 13px;
        }
        .row-card .eligible.yes { color: #4ade80; }
        .row-card .eligible.no { color: #f87171; }

        .log-area {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
        .log-area .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #151515;
        }
        .log-area .log-entry .time {
            color: #555;
            margin-right: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            border: 1px solid #333;
        }
        .modal-content h3 { margin-bottom: 12px; color: #ddd; }
        .modal-content textarea {
            width: 100%;
            background: #0d0d0d;
            color: #ddd;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 120px;
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .gap-1 { gap: 4px; }
        .mt-1 { margin-top: 6px; }
        .text-muted { color: #666; font-size: 12px; }
        .w-full { width: 100%; }
        .help-text { font-size: 12px; color: #555; margin-top: 4px; }
        .sample-btn { background: #2a5a2a; color: #8f8; }
        .sample-btn:hover { background: #3a7a3a; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⛓️ Flipkart Automation – Row Panel</h1>
        <div><span id="connection-status" style="color: #888; font-size: 13px;">● Connecting...</span></div>
    </div>

    <div class="status-summary" id="summary">
        <span>Total: <span class="count" id="totalCount">0</span></span>
        <span>Done: <span class="count" id="doneCount">0</span></span>
        <span>Eligible: <span class="count" id="eligibleCount">0</span></span>
        <span>Deleted: <span class="count" id="deletedCount">0</span></span>
        <span>Errors: <span class="count" id="errorCount">0</span></span>
    </div>

    <div class="controls">
        <div class="panel-area">
            <label style="display: block; font-size: 12px; color: #888; margin-bottom: 3px;">Panel Links (one per line)</label>
            <textarea id="panel-links" placeholder="https://profexpanel.netlify.app/?s=... or raw Firebase URL"></textarea>
            <div class="link-count" id="linkCount">Links: 0</div>
            <div class="help-text">Paste encoded links or raw Firebase URLs.</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <div class="mode-select">
                <label><input type="radio" name="mode" value="check" checked> Check</label>
                <label><input type="radio" name="mode" value="full"> Full</label>
            </div>
            <button class="btn btn-primary" id="startAllBtn" onclick="startAll()">▶ Start All</button>
            <button class="btn btn-secondary" id="stopAllBtn" onclick="stopAll()" disabled>⏹ Stop All</button>
            <button class="btn btn-success" onclick="fetchDevices()">🔄 Fetch Devices</button>
            <button class="btn btn-secondary" onclick="addRow()">➕ Add Row</button>
            <button class="btn btn-secondary" onclick="openBulk()">📋 Bulk Add</button>
            <button class="btn btn-secondary" onclick="removeAllRows()">🗑️ Clear All</button>
            <button class="btn sample-btn" onclick="loadSampleRows()">📂 Load Sample</button>
        </div>
    </div>

    <div class="row-container" id="rowContainer"></div>

    <div class="log-area" id="logArea">
        <div class="log-entry"><span class="time">[System]</span> Ready</div>
    </div>
</div>

<!-- Bulk Add Modal -->
<div class="modal" id="bulkModal">
    <div class="modal-content">
        <h3>Bulk Add Devices</h3>
        <p class="text-muted">Paste one per line: <code>phone device_id</code> or just <code>device_id</code> (if "Device ID only" checked below).</p>
        <textarea id="bulkText" placeholder="9723259509 f08d7f90cb359ed7&#10;f2aba219a2caacd7"></textarea>
        <div style="margin: 8px 0;">
            <label><input type="checkbox" id="bulkDevicesOnly"> Input are device IDs only</label>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeBulk()">Cancel</button>
            <button class="btn btn-primary" onclick="addBulk()">Add Devices</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // STATE
    // ============================================================
    let socket = null;
    let processing = false;
    let rows = {};
    let rowData = {};
    let summary = { total: 0, done: 0, eligible: 0, deleted: 0, error: 0 };
    let pendingInputs = {};

    const SAMPLE_DEVICES = [
        { phone: '9723259509', device: 'f08d7f90cb359ed7' },
        { phone: '7877113085', device: 'ec8ecffd950715da' },
        { phone: '9573563052', device: 'eafeb8fe9f977e6e' },
        { phone: '8401298542', device: 'e7d6d3753bb10b04' },
        { phone: '8360546719', device: 'e721a85440d4e9a2' },
        { phone: '7698928344', device: 'd9e47414f4fe33cd' },
        { phone: '8147475479', device: '8ed12e47cabe54be' },
        { phone: '9945509837', device: '7fec69e72528e53f' },
        { phone: '9592234377', device: '5087d899b03f255d' }
    ];

    // ============================================================
    // WEB SOCKET
    // ============================================================
    function connectSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            document.getElementById('connection-status').textContent = '● Connected';
            document.getElementById('connection-status').style.color = '#4ade80';
            addLog('System', 'Connected to server');
        };

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const type = msg.status;
            const data = msg.data;

            if (type === 'connected') {
                addLog('System', 'Handshake complete');
            } else if (type === 'processing_started') {
                summary.total = Object.keys(rows).length;
                updateSummary();
                addLog('System', `Processing started (${summary.total} tasks)`);
            } else if (type === 'status') {
                const key = data.device;
                if (!rows[key]) return;
                updateRow(key, data);
                if (data.status === 'done' || data.status === 'error') {
                    summary.done++;
                    updateSummary();
                }
                if (data.deleted) {
                    summary.deleted++;
                    updateSummary();
                }
                addLog(data.phone || key, `${data.status}: ${data.message || ''}`);
            } else if (type === 'await_input') {
                const key = data.device;
                if (!rows[key]) return;
                showInput(key, data.type, data.message);
                addLog(data.device, `Waiting for input: ${data.message}`);
            } else if (type === 'devices_fetched') {
                const devices = data.devices || [];
                if (!devices.length) {
                    alert('No online devices found in the panel.');
                    return;
                }
                // Remove existing rows silently
                for (const k in rows) {
                    rows[k].remove();
                }
                rows = {};
                rowData = {};
                summary = { total: 0, done: 0, eligible: 0, deleted: 0, error: 0 };
                updateSummary();
                for (const dev of devices) {
                    addRow(dev.phone, dev.device);
                }
                addLog('System', `Fetched ${devices.length} devices from panel.`);
            } else if (type === 'error') {
                addLog('Error', data.message);
            }
        };

        socket.onclose = () => {
            document.getElementById('connection-status').textContent = '● Disconnected';
            document.getElementById('connection-status').style.color = '#f87171';
            addLog('System', 'Disconnected from server');
            setTimeout(connectSocket, 3000);
        };

        socket.onerror = (err) => {
            addLog('WebSocket Error', err.message || 'Connection error');
        };
    }

    // ============================================================
    // DOM HELPERS
    // ============================================================
    function addLog(source, msg) {
        const logArea = document.getElementById('logArea');
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="time">[${time}]</span><span style="color:#6acfff;">${source}</span> ${msg}`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        if (logArea.children.length > 300) logArea.removeChild(logArea.firstChild);
    }

    function updateSummary() {
        document.getElementById('totalCount').textContent = summary.total;
        document.getElementById('doneCount').textContent = summary.done;
        let elig = 0;
        for (const key in rowData) if (rowData[key].eligible) elig++;
        document.getElementById('eligibleCount').textContent = elig;
        document.getElementById('deletedCount').textContent = summary.deleted;
        let err = 0;
        for (const key in rowData) if (rowData[key].status === 'error') err++;
        document.getElementById('errorCount').textContent = err;
    }

    document.getElementById('panel-links').addEventListener('input', function() {
        const lines = this.value.split('\n').filter(l => l.trim());
        document.getElementById('linkCount').textContent = `Links: ${lines.length}`;
    });

    // ============================================================
    // ROW OPERATIONS
    // ============================================================
    function createRowKey(phone, device) { return `${device}_${phone}`; }

    function addRow(phone = '', device = '') {
        if (!phone && !device) {
            const input = prompt('Enter phone and device ID (separated by space):');
            if (!input) return;
            const parts = input.trim().split(/\s+/);
            if (parts.length >= 2) { phone = parts[0]; device = parts[1]; }
            else { alert('Invalid format. Use: phone device_id'); return; }
        }
        phone = phone.trim(); device = device.trim();
        if (!phone || !device) return;
        const key = createRowKey(phone, device);
        if (rows[key]) { alert('Device already exists.'); return; }

        const container = document.getElementById('rowContainer');
        const row = document.createElement('div');
        row.className = 'row-card';
        row.dataset.key = key;
        row.innerHTML = `
            <span class="phone">${phone}</span>
            <span class="device">${device}</span>
            <span class="status"><span class="badge badge-starting">Idle</span></span>
            <div class="input-group">
                <input type="text" id="input-${key}" placeholder="Input" disabled>
                <button class="btn btn-primary btn-sm send-btn" id="send-${key}" onclick="sendInput('${key}')" disabled>Send</button>
            </div>
            <span class="coins">—</span>
            <span class="eligible">—</span>
            <div class="actions">
                <button class="btn btn-danger btn-sm remove-btn" onclick="removeRow('${key}')">✕</button>
            </div>
        `;
        container.appendChild(row);
        rows[key] = row;
        rowData[key] = { phone, device, status: 'idle', eligible: false, coins: 0, message: '', deleted: false };
        summary.total++;
        updateSummary();
        addLog(phone, `Row added (${device})`);
        return key;
    }

    function removeRow(key) {
        if (!rows[key]) return;
        rows[key].remove();
        delete rows[key];
        delete rowData[key];
        summary.total--;
        updateSummary();
        addLog('System', `Row removed: ${key}`);
        if (Object.keys(rows).length === 0) document.getElementById('stopAllBtn').disabled = true;
    }

    function removeAllRows() {
        if (Object.keys(rows).length === 0) return;
        if (!confirm('Remove all rows?')) return;
        for (const key in rows) rows[key].remove();
        rows = {}; rowData = {};
        summary = { total: 0, done: 0, eligible: 0, deleted: 0, error: 0 };
        updateSummary();
        addLog('System', 'All rows removed');
        document.getElementById('stopAllBtn').disabled = true;
    }

    function loadSampleRows() {
        if (Object.keys(rows).length > 0) {
            if (!confirm('This will remove all existing rows and load sample devices. Continue?')) return;
            removeAllRows();
        }
        for (const dev of SAMPLE_DEVICES) addRow(dev.phone, dev.device);
        addLog('System', `Loaded ${SAMPLE_DEVICES.length} sample rows.`);
    }

    function updateRow(key, data) {
        const row = rows[key];
        if (!row) return;
        rowData[key].status = data.status;
        if (data.eligible !== undefined) rowData[key].eligible = data.eligible;
        if (data.coins !== undefined) rowData[key].coins = data.coins;
        if (data.message) rowData[key].message = data.message;
        if (data.deleted) rowData[key].deleted = true;

        const statusSpan = row.querySelector('.status .badge');
        if (statusSpan) {
            const status = data.status || 'idle';
            const clsMap = {
                'starting': 'badge-starting',
                'bootstrap_start': 'badge-starting',
                'bootstrap_done': 'badge-starting',
                'otp_sending': 'badge-otp',
                'otp_sent': 'badge-otp',
                'otp_verifying': 'badge-verify',
                'otp_verified': 'badge-verified',
                'order_fetching': 'badge-starting',
                'order_fetched': 'badge-starting',
                'playing_games': 'badge-games',
                'game_start': 'badge-games',
                'game_done': 'badge-games',
                'gullak_starting': 'badge-games',
                'gullak_done': 'badge-games',
                'deleting': 'badge-deleting',
                'done': 'badge-done',
                'error': 'badge-error',
                'waiting_input': 'badge-waiting'
            };
            const cls = clsMap[status] || 'badge-starting';
            const label = status.replace(/_/g, ' ').toUpperCase();
            statusSpan.className = `badge ${cls}`;
            statusSpan.textContent = label;
        }
        const coinsEl = row.querySelector('.coins');
        if (coinsEl && data.coins !== undefined) coinsEl.textContent = data.coins;
        const eligEl = row.querySelector('.eligible');
        if (eligEl && data.eligible !== undefined) {
            eligEl.textContent = data.eligible ? '✅ Yes' : '❌ No';
            eligEl.className = `eligible ${data.eligible ? 'yes' : 'no'}`;
        }
        if (data.status === 'done' || data.status === 'error') {
            const inp = document.getElementById(`input-${key}`);
            const sendBtn = document.getElementById(`send-${key}`);
            if (inp) inp.disabled = true;
            if (sendBtn) sendBtn.disabled = true;
        }
    }

    function showInput(key, type, message) {
        const inp = document.getElementById(`input-${key}`);
        const sendBtn = document.getElementById(`send-${key}`);
        if (!inp || !sendBtn) return;
        inp.disabled = false;
        inp.placeholder = type === 'otp' ? 'OTP' : type === 'delete_otp' ? 'Delete OTP' : 'yes/no';
        sendBtn.disabled = false;
        inp.value = '';
        inp.focus();
        pendingInputs[key] = type;
        const row = rows[key];
        if (row) {
            const statusSpan = row.querySelector('.status .badge');
            if (statusSpan) {
                statusSpan.className = 'badge badge-waiting';
                statusSpan.textContent = 'WAITING INPUT';
            }
        }
    }

    function sendInput(key) {
        const inp = document.getElementById(`input-${key}`);
        if (!inp) return;
        const value = inp.value.trim();
        if (!value) { alert('Please enter a value'); return; }
        socket.send(JSON.stringify({ type: 'input_response', device: key, value: value }));
        inp.disabled = true;
        const sendBtn = document.getElementById(`send-${key}`);
        if (sendBtn) sendBtn.disabled = true;
        delete pendingInputs[key];
        addLog(rowData[key].phone, `Input sent: ${value}`);
    }

    // ============================================================
    // BULK ADD
    // ============================================================
    function openBulk() {
        document.getElementById('bulkModal').classList.add('active');
        document.getElementById('bulkText').value = '';
    }
    function closeBulk() { document.getElementById('bulkModal').classList.remove('active'); }
    function addBulk() {
        const text = document.getElementById('bulkText').value;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        const devicesOnly = document.getElementById('bulkDevicesOnly').checked;
        if (!lines.length) { alert('No entries.'); return; }
        let added = 0;
        for (const line of lines) {
            let phone = '', device = '';
            if (devicesOnly) {
                device = line;
            } else {
                const parts = line.split(/\s+/);
                if (parts.length >= 2) { phone = parts[0]; device = parts[1]; }
                else continue;
            }
            if (phone || device) { addRow(phone, device); added++; }
        }
        closeBulk();
        addLog('System', `Added ${added} rows`);
    }

    // ============================================================
    // FETCH DEVICES FROM PANEL
    // ============================================================
    function fetchDevices() {
        const panelLinks = document.getElementById('panel-links').value.split('\n').filter(l => l.trim());
        if (!panelLinks.length) {
            alert('Please provide at least one panel link.');
            return;
        }
        socket.send(JSON.stringify({ type: 'fetch_devices', panels: panelLinks }));
        addLog('System', 'Fetching devices from panel...');
    }

    // ============================================================
    // START / STOP
    // ============================================================
    function startAll() {
        if (processing) return;
        const panelLinks = document.getElementById('panel-links').value.split('\n').filter(l => l.trim());
        if (!panelLinks.length) {
            alert('Please provide at least one panel link.');
            return;
        }
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const tasks = [];
        for (const key in rowData) {
            const data = rowData[key];
            if (!data.phone && !data.device) continue;
            tasks.push({ phone: data.phone, device: data.device });
        }
        if (!tasks.length) {
            alert('No rows to process. Add rows using "Add Row", "Bulk Add", "Load Sample", or "Fetch Devices".');
            return;
        }
        processing = true;
        document.getElementById('startAllBtn').disabled = true;
        document.getElementById('stopAllBtn').disabled = false;
        const phoneLines = tasks.map(t => t.phone ? `${t.phone} ${t.device}` : t.device);
        socket.send(JSON.stringify({
            type: 'start',
            panels: panelLinks,
            phone_input: phoneLines,
            mode: mode,
            devices_only: false
        }));
        addLog('System', `Starting ${tasks.length} tasks...`);
    }

    function stopAll() {
        processing = false;
        document.getElementById('startAllBtn').disabled = false;
        document.getElementById('stopAllBtn').disabled = true;
        addLog('System', 'Stopped by user');
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'stop' }));
        }
    }

    // ============================================================
    // INIT
    // ============================================================
    window.onload = function() {
        connectSocket();
        // Update link count
        const textarea = document.getElementById('panel-links');
        const lines = textarea.value.split('\n').filter(l => l.trim());
        document.getElementById('linkCount').textContent = `Links: ${lines.length}`;
        // Auto-load sample rows
        loadSampleRows();
    };
</script>
</body>
</html>
